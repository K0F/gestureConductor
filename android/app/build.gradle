plugins {
    id 'com.android.application'
}

android {
    namespace 'org.kof.gestureconductor'
    compileSdk 34
    ndkVersion '26.1.10909125'

    defaultConfig {
        applicationId "org.kof.gestureconductor"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0.0"

        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a'
        }

        externalNativeBuild {
            cmake {
                cFlags "-std=c11 -O3 -Wall -Wextra"
                cppFlags "-std=c++17 -O3"
            }
        }
    }

    externalNativeBuild {
        cmake {
            path file('src/main/cpp/CMakeLists.txt')
            version "3.22.1"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
        debug {
            signingConfig signingConfigs.debug
        }
    }

    signingConfigs {
        debug {
            def debugKS = System.getenv("ANDROID_USER_HOME")
                    ? new File(System.getenv("ANDROID_USER_HOME"), "debug.keystore")
                    : new File(System.getProperty("user.home"), ".config/.android/debug.keystore")
            storeFile debugKS.exists() ? debugKS : new File(System.getProperty("user.home"), ".android/debug.keystore")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        disable 'IconMissingDensityFolder', 'AllowBackup'
    }
}

dependencies {
}
